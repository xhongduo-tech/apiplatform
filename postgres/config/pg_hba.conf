# PostgreSQL 客户端认证 — Open API Platform 内置数据库
# 由 docker-compose.app.yml 挂载到 /etc/postgresql/pg_hba.conf

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# 本地 Unix 域套接字（容器内管理用）
local   all             all                                     scram-sha-256

# 本机回环
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# ── 平台后端连接 ─────────────────────────────────────────────────────────────
host    openapi_platform   platform        10.0.0.0/8              scram-sha-256
host    openapi_platform   platform        172.16.0.0/12           scram-sha-256
host    openapi_platform   platform        192.168.0.0/16          scram-sha-256

# 拒绝其余所有连接（避免默认 trust/md5 兜底）
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
