# PostgreSQL 配置 — Open API Platform 内置数据库
# 备份由 pg-backup 边车定期执行覆盖式 pg_dump；本配置不启用流复制。
# 由 docker-compose.app.yml 挂载到 /etc/postgresql/postgresql.conf

# ── 网络监听 ───────────────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432

# 连接保活：避免防火墙/NAT 静默断开空闲 TCP 连接
tcp_keepalives_idle = 30
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# 防止应用异常未提交事务长期持有连接
idle_in_transaction_session_timeout = 1h

# ── 连接数 ─────────────────────────────────────────────────────────────────
# 应用侧连接池 pool_size=20 + max_overflow=40，按 GUNICORN_WORKERS 倍增；
# 200 可支撑 4 worker 的满池 + 备份/运维连接。
max_connections = 200

# PostgreSQL 默认值；当前发行版不配置复制槽或备库。
wal_level = replica

# ── 内存/检查点（通用起始值，生产环境请按资源调整）──────────────────────────
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 4MB
min_wal_size = 1GB
max_wal_size = 4GB

# ── 日志（Docker 内写 stderr，由 docker logs 收集；勿开 logging_collector）──
logging_collector = off
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_min_messages = warning

# ── 其它 ───────────────────────────────────────────────────────────────────
unix_socket_directories = '/var/run/postgresql'
ssl = off
