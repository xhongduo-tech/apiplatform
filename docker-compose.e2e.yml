services:
  mock-upstream:
    image: ${BACKEND_IMAGE:-apiplatform-backend:e2e}
    pull_policy: never
    entrypoint: ["python", "/e2e/mock_upstream.py"]
    volumes:
      - ./e2e/mock_upstream.py:/e2e/mock_upstream.py:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')\""]
      interval: 2s
      timeout: 2s
      retries: 20

  backend:
    environment:
      GUNICORN_WORKERS: "1"
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
      DB_CONNECTION_RESERVE: "10"
      DEMO_DATA_ENABLED: "false"
      UPSTREAM_TLS_VERIFY: "false"
    depends_on:
      mock-upstream:
        condition: service_healthy
