worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75s;
    keepalive_requests 1000;
    server_tokens   off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # 默认不信任任何客户端提供的 X-Forwarded-For。容器启动脚本只会为部署方
    # 明确配置的 TRUSTED_PROXY_CIDRS 生成 set_real_ip_from 指令。
    include /tmp/real_ip.conf;

    # Only authentication endpoints participate in this zone.  An empty key is
    # not accounted by nginx, so normal API/inference traffic is unaffected.
    map $uri $auth_limit_key {
        default "";
        ~^/api/user/(login|register|recover|reset-password)$ $binary_remote_addr;
        ~^/api/admin/login$ $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth_per_ip:10m rate=10r/m;

    # HSTS is meaningful only when this container is behind a TLS terminator.
    map $http_x_forwarded_proto $hsts_header {
        default "";
        https "max-age=31536000; includeSubDomains";
    }

    # 预压缩静态资源（vite 产出 .gz 兄弟文件）
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml font/woff2 image/svg+xml;
    gzip_min_length 1024;

    open_file_cache max=4096 inactive=60s;
    open_file_cache_valid 120s;

    # 允许大请求体（base64 图片、大批量 embedding 输入）
    # 单张图片 base64 后约 1.3x，50m 支持约 38MB 原始图片
    client_max_body_size 50m;

    upstream backend {
        server backend:8000;
        keepalive 64;
        # 复用连接的空闲上限必须**短于**后端的 keep-alive（gunicorn --keep-alive 75），
        # 否则 nginx 会挑中一条后端刚刚关掉的池内连接去发请求：POST 属非幂等，
        # nginx 默认不重试，调用方直接收到 502。并发越高命中概率越大。
        keepalive_timeout 30s;
        keepalive_requests 1000;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security_headers.conf;

        # ── 大模型流式中继：关闭缓冲，长超时 ──────────────────────────────
        location /v1/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
        }

        location /beta/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
        }

        # ── 管理与用户 REST ───────────────────────────────────────────────
        location /api/ {
            limit_req zone=auth_per_ip burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://backend/health;
        }

        location = /admin {
            return 302 /admin.html;
        }

        location = /admin/ {
            return 302 /admin.html;
        }

        # 注意：location 内出现任意 add_header 会丢弃 server 级继承的响应头，
        # 因此以下每个 location 都需重复安全头。
        location = /admin.html {
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Vite 的 /assets 文件名带内容 hash，可以安全 immutable。
        location ^~ /assets/ {
            expires 365d;
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # public/ 中的文件名没有内容 hash，升级后必须允许重新验证。
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires -1;
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # ── SPA 回退；index.html 不缓存 ───────────────────────────────────
        location / {
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
