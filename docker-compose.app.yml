# Open API Platform — prebuilt-image / offline deployment
#
# 数据库 postgres 服务随平台编排；pg-backup 边车定期执行轮换、校验过的
# PostgreSQL custom-format 快照到 Compose 项目隔离的 pgbackups 卷。
#
# 从源码构建并启动：docker compose up -d --build（使用 docker-compose.yml）
# 官方预构建部署必须在 .env 中把 BACKEND_IMAGE/NGINX_IMAGE 设为已验证的
# GHCR @sha256 RepoDigest；默认的本地版本 tag 仅供源码构建与离线编排。
# 启动：docker compose -f docker-compose.app.yml up -d
# backend entrypoint 会自动迁移空库并按 DEMO_DATA_ENABLED 决定是否写入虚构数据。
#
# 离线包：由 build-offline.sh 自动打包，内网直接运行。
x-logging: &default-logging
  driver: json-file
  options:
    # Prevent long-running gateways from exhausting the Docker host disk.
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

services:
  # ── 数据库（Compose 项目独立卷，不挂载其他项目的历史数据）──────────────────
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685}
    pull_policy: ${COMPOSE_PULL_POLICY:-if_not_present}
    restart: unless-stopped
    logging: *default-logging
    shm_size: 256mb
    environment:
      POSTGRES_DB: openapi_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置随机 POSTGRES_PASSWORD}
      # 初始化用 scram-sha-256，与 pg_hba 的 METHOD 保持一致
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # 仅绑回环，不暴露到 LAN；业务连接走 compose 默认网桥
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d openapi_platform"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 轮换备份边车：默认每小时生成并验证一次，保留最近 168 份（约 7 天）。
  pg-backup:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685}
    pull_policy: ${COMPOSE_PULL_POLICY:-if_not_present}
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: platform
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置随机 POSTGRES_PASSWORD}
      PGDATABASE: openapi_platform
      BACKUP_INTERVAL_S: ${BACKUP_INTERVAL_S:-3600}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-168}
      BACKUP_FAILURE_RETRY_S: ${BACKUP_FAILURE_RETRY_S:-60}
      BACKUP_MAX_CONSECUTIVE_FAILURES: ${BACKUP_MAX_CONSECUTIVE_FAILURES:-3}
      BACKUP_READER_GID: ${BACKUP_READER_GID:-10001}
    volumes:
      - pgbackups:/backups
      - ./postgres/backup-loop.sh:/backup-loop.sh:ro
      - ./postgres/backup-healthcheck.sh:/backup-healthcheck.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/backup-healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf}
    pull_policy: ${COMPOSE_PULL_POLICY:-if_not_present}
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置随机 REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    # 仅绑回环，不暴露到 LAN
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?请在 .env 中设置随机 REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-apiplatform-backend:1.0.1}
    pull_policy: ${COMPOSE_PULL_POLICY:-if_not_present}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 45s
    environment:
      # 同机内置 postgres 服务，走 compose 默认网桥按服务名直连。
      # 切勿填 127.0.0.1——那是 backend 容器自己的回环。
      ENVIRONMENT: production
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      # 商业版等外部发行物仅通过版本化扩展契约接入；社区版默认不加载扩展。
      APPLICATION_EXTENSIONS: ${APPLICATION_EXTENSIONS:-}
      DATABASE_URL: postgresql+psycopg://platform:${POSTGRES_PASSWORD:?请在 .env 中设置随机 POSTGRES_PASSWORD}@postgres:5432/openapi_platform
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置随机 REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置随机 REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_CONNECT_TIMEOUT_S: ${REDIS_CONNECT_TIMEOUT_S:-2}
      REDIS_SOCKET_TIMEOUT_S: ${REDIS_SOCKET_TIMEOUT_S:-2}
      RATE_LIMIT_ADMISSION_TIMEOUT_S: ${RATE_LIMIT_ADMISSION_TIMEOUT_S:-3}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置随机 JWT_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?请在 .env 中设置独立的 32 字节 base64url DATA_ENCRYPTION_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-open-api-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-open-api-platform}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-4}
      USER_JWT_TTL_HOURS: ${USER_JWT_TTL_HOURS:-8}
      USER_SESSION_COOKIE: ${USER_SESSION_COOKIE:-platform_session}
      ADMIN_SESSION_COOKIE: ${ADMIN_SESSION_COOKIE:-platform_admin_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?请在 .env 中设置由至少 32 个随机字节生成的 ADMIN_BOOTSTRAP_TOKEN}
      ADMIN_SENSITIVE_ACTION_MAX_AGE_S: ${ADMIN_SENSITIVE_ACTION_MAX_AGE_S:-600}
      ALLOW_ADMIN_RAW_BACKUP_DOWNLOAD: ${ALLOW_ADMIN_RAW_BACKUP_DOWNLOAD:-false}
      BACKUP_INTERVAL_S: ${BACKUP_INTERVAL_S:-3600}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      ALLOW_PASSWORD_RECOVERY: ${ALLOW_PASSWORD_RECOVERY:-false}
      # backend 只经同一 compose 网络中的 nginx 访问，可信任其客户端地址头。
      TRUST_PROXY_HEADERS: "true"
      # 开源发行版默认展示完全虚构的看板数据；任一用户/Key 已存在时自动跳过。
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      UPSTREAM_TLS_VERIFY: ${UPSTREAM_TLS_VERIFY:-true}
      # 无限流量绕过默认关闭；仅在完成容量隔离与滥用风险评估后显式开启。
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-600}
      RATE_LIMIT_TPM: ${RATE_LIMIT_TPM:-6000000}
      RATE_LIMIT_DEFAULT_MAX_OUTPUT_TOKENS: ${RATE_LIMIT_DEFAULT_MAX_OUTPUT_TOKENS:-4096}
      NIGHT_UNLIMITED_ENABLED: ${NIGHT_UNLIMITED_ENABLED:-false}
      NIGHT_UNLIMITED_START: ${NIGHT_UNLIMITED_START:-19:00}
      NIGHT_UNLIMITED_END: ${NIGHT_UNLIMITED_END:-07:30}
      PLATFORM_TIMEZONE: ${PLATFORM_TIMEZONE:-Asia/Shanghai}
      RATE_LIMIT_MODEL_EXEMPTIONS_ENABLED: ${RATE_LIMIT_MODEL_EXEMPTIONS_ENABLED:-false}
      USAGE_FAILOVER_DIR: /var/lib/apiplatform/usage
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-4}
      DB_POOL_TIMEOUT_S: ${DB_POOL_TIMEOUT_S:-30}
      DB_APP_INSTANCES: ${DB_APP_INSTANCES:-1}
      DB_CONNECTION_RESERVE: ${DB_CONNECTION_RESERVE:-32}
      HTTPX_MAX_CONNECTIONS: ${HTTPX_MAX_CONNECTIONS:-256}
      HTTPX_MAX_KEEPALIVE: ${HTTPX_MAX_KEEPALIVE:-64}
      USAGE_CONTENT_LOGGING_ENABLED: ${USAGE_CONTENT_LOGGING_ENABLED:-false}
      USAGE_LOG_RETENTION_DAYS: ${USAGE_LOG_RETENTION_DAYS:-90}
      USAGE_PROFILE_RETENTION_DAYS: ${USAGE_PROFILE_RETENTION_DAYS:-180}
      PUBLIC_STATUS_CACHE_TTL_S: ${PUBLIC_STATUS_CACHE_TTL_S:-10}
      PUBLIC_STATUS_QUERY_TIMEOUT_MS: ${PUBLIC_STATUS_QUERY_TIMEOUT_MS:-3000}
      PUBLIC_STATUS_RATE_PER_MINUTE: ${PUBLIC_STATUS_RATE_PER_MINUTE:-120}
    volumes:
      # 只读挂载备份目录；后台默认只能看状态，原始下载需显式开启。
      - pgbackups:/backups:ro
      # DB 短时故障期间的用量事件 WAL；容器重建后仍可幂等回灌。
      - usagefailover:/var/lib/apiplatform/usage
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health'); d=json.load(r); sys.exit(0 if r.status==200 and d.get('status')=='ok' else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ── 监控（Prometheus 抓 backend:8000/metrics，Grafana 出看板）─────────────────
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69}
    pull_policy: ${COMPOSE_PULL_POLICY:-if_not_present}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 仅回环：Grafana 走 compose 网络访问，不暴露到 LAN
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b}
    pull_policy: ${COMPOSE_PULL_POLICY:-if_not_present}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    environment:
      # 默认不创建 Grafana 管理员，避免发行包携带共享口令；如需编辑看板，部署方
      # 同时设置 GRAFANA_DISABLE_INITIAL_ADMIN_CREATION=false 与独立强密码。
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "${GRAFANA_DISABLE_INITIAL_ADMIN_CREATION:-true}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
      # 匿名查看默认关闭；需要公开看板时由部署方显式开启。
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: ${NGINX_IMAGE:-apiplatform-nginx:1.0.1}
    pull_policy: ${COMPOSE_PULL_POLICY:-if_not_present}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 15s
    environment:
      # 仅在 nginx 前还有受信 TLS/负载均衡代理时设置其精确 IP/CIDR；默认不信任
      # 客户端 X-Forwarded-For，且启动脚本拒绝 0.0.0.0/0 与 ::/0。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      # first-claim 管理员完成首次设密前只监听回环；初始化后由部署方显式改为
      # 0.0.0.0、指定管理网地址，或放到已配置访问控制的反向代理后。
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  redisdata:
  promdata:
  grafanadata:
  pgdata:
  pgbackups:
  usagefailover:
