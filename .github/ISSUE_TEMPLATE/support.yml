name: Support question
description: Ask for help with installation, configuration, or operation
title: "[Support]: "
labels: [support, needs-triage]
body:
  - type: markdown
    attributes:
      value: Read README.md, docs/ and SUPPORT.md before opening a question.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain the goal, what you tried, and the sanitized result.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed all credentials, personal data, internal addresses, and response content.
          required: true
        - label: This is not a security vulnerability.
          required: true
