name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-main-ci:
    name: Require successful Community CI
    runs-on: ubuntu-latest
    outputs:
      release_tag_object_sha: ${{ steps.release_tag.outputs.tag_object_sha }}
    permissions:
      actions: read # Query the exact CI workflow run and attempt.
      checks: read # Bind each CI job to its GitHub-authored check run.
      contents: read
      security-events: read # Reject unresolved High/Critical CodeQL alerts.
    steps:
      - name: Require a verified maintainer-signed annotated tag
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_ref="refs/tags/${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF" != "$expected_ref" || "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::release workflow requires a v* tag ref"
            exit 1
          fi

          encoded_tag="$(jq -rn --arg tag "$GITHUB_REF_NAME" '$tag | @uri')"
          ref_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}")"
          if ! tag_object_sha="$(jq -er --arg expected_ref "$expected_ref" '
            select(.ref == $expected_ref and .object.type == "tag")
            | .object.sha
            | select(type == "string" and test("^[0-9a-f]{40}$"))
          ' <<<"$ref_json")"; then
            echo "::error::release ref must resolve exactly to an annotated tag object"
            exit 1
          fi

          tag_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          if ! jq -e \
            --arg expected_tag "$GITHUB_REF_NAME" \
            --arg expected_tag_sha "$tag_object_sha" \
            --arg expected_commit "$GITHUB_SHA" '
              .sha == $expected_tag_sha and
              .tag == $expected_tag and
              .object.type == "commit" and
              .object.sha == $expected_commit and
              .verification.verified == true and
              .verification.reason == "valid" and
              .tagger.name == "徐鸿铎" and
              .tagger.email == "x.hongduo@hotmail.com"
            ' <<<"$tag_json" >/dev/null; then
            echo "::error::release tag must point directly to ${GITHUB_SHA} and have a valid GitHub-verified signature from 徐鸿铎 <x.hongduo@hotmail.com>"
            jq -c '{sha, tag, object, tagger: {name: .tagger.name, email: .tagger.email}, verification: {verified: .verification.verified, reason: .verification.reason}}' <<<"$tag_json"
            exit 1
          fi
          echo "tag_object_sha=${tag_object_sha}" >> "$GITHUB_OUTPUT"
          echo "Authenticated signed annotated tag ${GITHUB_REF_NAME} at ${GITHUB_SHA}."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install source validation dependencies
        run: python -m pip install --require-hashes --requirement backend/requirements.lock
      - name: Install release hygiene dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep
      - name: Validate release identity and public tree
        run: |
          python scripts/check-version-sync.py
          python scripts/check-release-tag.py "$GITHUB_REF_NAME"
          bash scripts/check-public-release.sh
          python scripts/export-openapi.py --check
      - name: Require the tagged commit to be the current default-branch HEAD
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          default_head="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          if [[ "$default_head" != "$GITHUB_SHA" ]]; then
            echo "::error::release tag must point to current ${DEFAULT_BRANCH} HEAD"
            echo "::error::tag=${GITHUB_SHA} default_head=${default_head}"
            exit 1
          fi
      - name: Require every release-critical CI check on this commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          runs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch="$DEFAULT_BRANCH" \
            -f event=push \
            -f head_sha="$GITHUB_SHA" \
            -f status=success \
            -F per_page=100)"
          run_identity="$(jq -r \
            --arg branch "$DEFAULT_BRANCH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(
                .event == "push" and
                .head_branch == $branch and
                .head_sha == $sha and
                .path == ".github/workflows/ci.yml" and
                .repository.full_name == $repository and
                .status == "completed" and
                .conclusion == "success"
              )]
              | sort_by(.created_at, .run_attempt) | last
              | if . == null then "missing" else [.id, .run_attempt] | @tsv end
            ' <<<"$runs")"
          if [[ "$run_identity" == "missing" ]]; then
            echo "::error::no successful push run of .github/workflows/ci.yml on ${DEFAULT_BRANCH} has head SHA ${GITHUB_SHA}"
            exit 1
          fi
          IFS=$'\t' read -r run_id run_attempt <<<"$run_identity"

          jobs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}/jobs?per_page=100")"
          checks="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
          required_checks=(
            "Release hygiene"
            "Dependency security"
            "Backend"
            "Frontend"
            "Full-stack browser E2E"
            "Container security"
          )
          for check_name in "${required_checks[@]}"; do
            job_url="$(jq -r \
              --arg name "$check_name" \
              --arg sha "$GITHUB_SHA" \
              --argjson attempt "$run_attempt" \
              --argjson run_id "$run_id" '
                [.jobs[] | select(
                  .name == $name and
                  .run_id == $run_id and
                  .run_attempt == $attempt and
                  .head_sha == $sha and
                  .status == "completed" and
                  .conclusion == "success"
                )]
                | if length == 1 then .[0].html_url else "missing-or-ambiguous" end
              ' <<<"$jobs")"
            if [[ "$job_url" == "missing-or-ambiguous" ]]; then
              echo "::error::required CI job '$check_name' is not uniquely successful in run ${run_id}, attempt ${run_attempt}"
              exit 1
            fi
            conclusion="$(jq -r \
              --arg job_url "$job_url" \
              --arg name "$check_name" '
              [.check_runs[] | select(
                .name == $name and
                .app.slug == "github-actions" and
                .details_url == $job_url
              )]
              | if length == 1 then .[0].conclusion // "missing" else "ambiguous" end
            ' <<<"$checks")"
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::required CI check '$check_name' from GitHub Actions run ${run_id} is '$conclusion' for ${GITHUB_SHA}"
              exit 1
            fi
          done

          codeql_runs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs" \
            -f branch="$DEFAULT_BRANCH" \
            -f event=push \
            -f head_sha="$GITHUB_SHA" \
            -f status=success \
            -F per_page=100)"
          codeql_identity="$(jq -r \
            --arg branch "$DEFAULT_BRANCH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(
                .event == "push" and
                .head_branch == $branch and
                .head_sha == $sha and
                .path == ".github/workflows/codeql.yml" and
                .repository.full_name == $repository and
                .status == "completed" and
                .conclusion == "success"
              )]
              | sort_by(.created_at, .run_attempt) | last
              | if . == null then "missing" else [.id, .run_attempt] | @tsv end
            ' <<<"$codeql_runs")"
          if [[ "$codeql_identity" == "missing" ]]; then
            echo "::error::no successful push run of .github/workflows/codeql.yml on ${DEFAULT_BRANCH} has head SHA ${GITHUB_SHA}"
            exit 1
          fi
          IFS=$'\t' read -r codeql_run_id codeql_run_attempt <<<"$codeql_identity"
          codeql_jobs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${codeql_run_id}/attempts/${codeql_run_attempt}/jobs?per_page=100")"
          required_codeql_checks=(
            "CodeQL (javascript-typescript)"
            "CodeQL (python)"
          )
          for check_name in "${required_codeql_checks[@]}"; do
            job_url="$(jq -r \
              --arg name "$check_name" \
              --arg sha "$GITHUB_SHA" \
              --argjson attempt "$codeql_run_attempt" \
              --argjson run_id "$codeql_run_id" '
                [.jobs[] | select(
                  .name == $name and
                  .run_id == $run_id and
                  .run_attempt == $attempt and
                  .head_sha == $sha and
                  .status == "completed" and
                  .conclusion == "success"
                )]
                | if length == 1 then .[0].html_url else "missing-or-ambiguous" end
              ' <<<"$codeql_jobs")"
            if [[ "$job_url" == "missing-or-ambiguous" ]]; then
              echo "::error::required CodeQL job '$check_name' is not uniquely successful in run ${codeql_run_id}, attempt ${codeql_run_attempt}"
              exit 1
            fi
            conclusion="$(jq -r \
              --arg job_url "$job_url" \
              --arg name "$check_name" '
                [.check_runs[] | select(
                  .name == $name and
                  .app.slug == "github-actions" and
                  .details_url == $job_url
                )]
                | if length == 1 then .[0].conclusion // "missing" else "ambiguous" end
              ' <<<"$checks")"
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::required CodeQL check '$check_name' is '$conclusion' for ${GITHUB_SHA}"
              exit 1
            fi
          done

          open_codeql_alert_pages="$(gh api --paginate --slurp --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
            -f ref="refs/heads/${DEFAULT_BRANCH}" \
            -f state=open \
            -f tool_name=CodeQL \
            -F per_page=100)"
          blocking_codeql_alerts="$(jq -c '
            add
            | map(select(
                .state == "open" and
                (.rule.security_severity_level == "critical" or
                 .rule.security_severity_level == "high")
              ))
            | map({
                number,
                severity: .rule.security_severity_level,
                rule: .rule.id,
                path: .most_recent_instance.location.path,
                url: .html_url
              })
          ' <<<"$open_codeql_alert_pages")"
          if [[ "$(jq 'length' <<<"$blocking_codeql_alerts")" -ne 0 ]]; then
            echo "::error::open High/Critical CodeQL alerts block this release"
            jq . <<<"$blocking_codeql_alerts"
            exit 1
          fi
          echo "Verified Community CI run ${run_id} and CodeQL run ${codeql_run_id} on ${DEFAULT_BRANCH} at ${GITHUB_SHA}."

  signed-images:
    name: Versioned images, SBOM and signatures
    runs-on: ubuntu-latest
    needs: verified-main-ci
    outputs:
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      backend_image: ${{ steps.metadata.outputs.backend_image }}
      backend_ref: ${{ steps.candidates.outputs.backend_ref }}
      release_version: ${{ steps.metadata.outputs.release_version }}
      web_image: ${{ steps.metadata.outputs.web_image }}
      web_ref: ${{ steps.candidates.outputs.web_ref }}
    permissions:
      actions: read # Allow release artifact metadata operations.
      attestations: write # Publish GitHub build-provenance attestations.
      contents: read
      id-token: write # Obtain a short-lived OIDC identity for Cosign.
      packages: write # Push the versioned Community container images.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Define immutable release image names
        id: metadata
        run: |
          mkdir -p release
          version="$(cat VERSION)"
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          repository_name="${repository#*/}"
          backend_image="ghcr.io/${repository}-backend:$version"
          web_image="ghcr.io/${repository}-web:$version"
          staging_suffix="staging-${version}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backend_staging_image="${backend_image%:*}:${staging_suffix}"
          web_staging_image="${web_image%:*}:${staging_suffix}"
          {
            echo "RELEASE_VERSION=$version"
            echo "BACKEND_IMAGE=$backend_image"
            echo "BACKEND_STAGING_IMAGE=$backend_staging_image"
            echo "BACKEND_PACKAGE=${repository_name}-backend"
            echo "WEB_IMAGE=$web_image"
            echo "WEB_STAGING_IMAGE=$web_staging_image"
            echo "WEB_PACKAGE=${repository_name}-web"
          } >> "$GITHUB_ENV"
          {
            echo "release_version=$version"
            echo "artifact_name=open-api-platform-${version}"
            echo "backend_image=$backend_image"
            echo "backend_staging_image=$backend_staging_image"
            echo "web_image=$web_image"
            echo "web_staging_image=$web_staging_image"
          } >> "$GITHUB_OUTPUT"
      - name: Build versioned images locally
        run: |
          source_url="https://github.com/${GITHUB_REPOSITORY}"
          docker build \
            --label "org.opencontainers.image.source=${source_url}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${RELEASE_VERSION}" \
            -t "$BACKEND_IMAGE" backend
          docker build \
            --label "org.opencontainers.image.source=${source_url}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${RELEASE_VERSION}" \
            -t "$WEB_IMAGE" -f nginx/Dockerfile .
      - name: Scan backend for all CRITICAL vulnerabilities before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.backend_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan backend for fixable HIGH vulnerabilities before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.backend_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
      - name: Scan web image for all CRITICAL vulnerabilities before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.web_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan web image for fixable HIGH vulnerabilities before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.metadata.outputs.web_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
      - name: Sign in to GitHub Container Registry
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Publish images to unique commit/run/attempt-bound staging tags
        id: images
        shell: bash
        run: |
          set -Eeuo pipefail

          resolve_remote_ref() {
            local image=$1 output digest attempt
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
                digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$output")"
                if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf '%s@%s\n' "${image%:*}" "$digest"
                  return 0
                fi
              fi
              sleep 2
            done
            echo "::error::published tag ${image} did not resolve to a complete remote digest" >&2
            printf '%s\n' "${output:-no registry response}" >&2
            return 1
          }

          publish_staging() {
            local image=$1 staging_image=$2
            local push_output push_digest digest_lines digest_count staging_ref
            docker tag "$image" "$staging_image"
            if ! push_output="$(docker push "$staging_image" 2>&1)"; then
              printf '%s\n' "$push_output" >&2
              echo "::error::failed to push run-scoped staging tag ${staging_image}" >&2
              return 1
            fi
            printf '%s\n' "$push_output" >&2
            digest_lines="$(grep -Eo 'digest: sha256:[0-9a-f]{64}' \
              <<<"$push_output" | awk '{print $2}' | LC_ALL=C sort -u || true)"
            digest_count="$(printf '%s\n' "$digest_lines" | grep -c . || true)"
            if [[ "$digest_count" -ne 1 ]]; then
              echo "::error::docker push did not report exactly one complete staging digest" >&2
              return 1
            fi
            push_digest="$digest_lines"
            staging_ref="$(resolve_remote_ref "$staging_image")"
            if [[ "$staging_ref" != "${staging_image%:*}@${push_digest}" ]]; then
              echo "::error::staging tag does not resolve to the exact docker push digest" >&2
              echo "::error::push=${push_digest} registry=${staging_ref}" >&2
              return 1
            fi
            printf '%s\n' "$staging_ref"
          }

          verify_release_labels() {
            local ref=$1 labels source_url
            source_url="https://github.com/${GITHUB_REPOSITORY}"
            docker pull "$ref" >/dev/null
            labels="$(docker image inspect --format '{{json .Config.Labels}}' "$ref")"
            jq -e \
              --arg source "$source_url" \
              --arg revision "$GITHUB_SHA" \
              --arg version "$RELEASE_VERSION" '
                .["org.opencontainers.image.source"] == $source and
                .["org.opencontainers.image.revision"] == $revision and
                .["org.opencontainers.image.version"] == $version
              ' <<<"$labels" >/dev/null || {
                echo "::error::final image ${ref} has incorrect source/revision/version labels"
                exit 1
              }
          }

          backend_ref="$(publish_staging "$BACKEND_IMAGE" "$BACKEND_STAGING_IMAGE")"
          web_ref="$(publish_staging "$WEB_IMAGE" "$WEB_STAGING_IMAGE")"
          verify_release_labels "$backend_ref"
          verify_release_labels "$web_ref"
          backend_name="${backend_ref%@*}"
          backend_digest="${backend_ref#*@}"
          web_name="${web_ref%@*}"
          web_digest="${web_ref#*@}"
          for digest in "$backend_digest" "$web_digest"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::published image did not resolve to a complete sha256 RepoDigest: ${digest}"
              exit 1
            fi
          done
          printf '%s\n' \
            "backend_ref=${backend_ref}" \
            "backend_name=${backend_name}" \
            "backend_digest=${backend_digest}" \
            "backend_staging_image=${BACKEND_STAGING_IMAGE}" \
            "web_ref=${web_ref}" \
            "web_name=${web_name}" \
            "web_digest=${web_digest}" \
            "web_staging_image=${WEB_STAGING_IMAGE}" \
            >> "$GITHUB_OUTPUT"
      - name: Scan staged backend digest for all CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backend_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan staged backend digest for fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backend_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
      - name: Scan staged web digest for all CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.web_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan staged web digest for fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.web_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
      - name: Detect exact staged provenance for resumable reruns
        id: provenance_state
        env:
          BACKEND_REF: ${{ steps.images.outputs.backend_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_REF: ${{ steps.images.outputs.web_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          has_exact_provenance() {
            local image_ref=$1 verification image_name digest_hex
            if ! verification="$(gh attestation verify "oci://${image_ref}" \
              --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --format json 2>/dev/null)"; then
              return 10
            fi
            image_name="${image_ref%@*}"
            digest_hex="${image_ref##*@sha256:}"
            jq -e --arg image_name "$image_name" --arg digest_hex "$digest_hex" '
              length > 0 and any(.[].verificationResult.statement;
                .predicateType == "https://slsa.dev/provenance/v1" and
                any(.subject[]; .name == $image_name and .digest.sha256 == $digest_hex)
              )
            ' <<<"$verification" >/dev/null
          }
          for role in backend web; do
            case "$role" in
              backend) image_ref="$BACKEND_REF" ;;
              web) image_ref="$WEB_REF" ;;
            esac
            if has_exact_provenance "$image_ref"; then
              exists=true
            else
              state=$?
              [[ "$state" -eq 10 || "$state" -eq 1 ]] || exit "$state"
              exists=false
            fi
            echo "${role}_exists=${exists}" >> "$GITHUB_OUTPUT"
          done
      - name: Attest backend build provenance
        if: steps.provenance_state.outputs.backend_exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.backend_name }}
          subject-digest: ${{ steps.images.outputs.backend_digest }}
          push-to-registry: true
          # Personal-account repositories cannot create organization artifact
          # metadata storage records; the verifiable bundle remains in OCI.
          create-storage-record: false
      - name: Attest web build provenance
        if: steps.provenance_state.outputs.web_exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.web_name }}
          subject-digest: ${{ steps.images.outputs.web_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify exact image provenance before signing
        env:
          BACKEND_REF: ${{ steps.images.outputs.backend_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_REF: ${{ steps.images.outputs.web_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for image_ref in "$BACKEND_REF" "$WEB_REF"; do
            verification="$(gh attestation verify "oci://${image_ref}" \
              --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --format json)"
            image_name="${image_ref%@*}"
            digest_hex="${image_ref##*@sha256:}"
            if ! jq -e --arg image_name "$image_name" --arg digest_hex "$digest_hex" '
              length > 0 and any(.[].verificationResult.statement;
                .predicateType == "https://slsa.dev/provenance/v1" and
                any(.subject[]; .name == $image_name and .digest.sha256 == $digest_hex)
              )
            ' <<<"$verification" >/dev/null; then
              echo "::error::verified provenance does not bind exact subject ${image_ref}"
              exit 1
            fi
          done
      - name: Keyless-sign staged image digests
        run: |
          set -Eeuo pipefail
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for image_ref in "$BACKEND_REF" "$WEB_REF"; do
            if cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image_ref" >/dev/null 2>&1; then
              echo "Reusing the exact staged digest signature for ${image_ref}."
            else
              cosign sign --yes "$image_ref"
            fi
          done
        env:
          BACKEND_REF: ${{ steps.images.outputs.backend_ref }}
          WEB_REF: ${{ steps.images.outputs.web_ref }}
      - name: Select immutable canonical candidates through the OCI registry
        id: candidates
        env:
          BACKEND_STAGING_REF: ${{ steps.images.outputs.backend_ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_STAGING_REF: ${{ steps.images.outputs.web_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail

          registry_ref_if_exists() {
            local image=$1 image_path repository_path tag token_json bearer
            local response headers status api_digest inspect_output inspect_digest
            image_path="${image#ghcr.io/}"
            if [[ "$image_path" == "$image" || "$image_path" != *:* ]]; then
              echo "::error::canonical image is not a tagged GHCR reference: ${image}" >&2
              return 1
            fi
            repository_path="${image_path%:*}"
            tag="${image_path##*:}"
            token_json="$(curl --fail-with-body --silent --show-error \
              --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              --get \
              --data-urlencode service=ghcr.io \
              --data-urlencode "scope=repository:${repository_path}:pull" \
              https://ghcr.io/token)"
            bearer="$(jq -er '(.token // .access_token) | strings | select(length > 0)' \
              <<<"$token_json")"
            response="$(curl --silent --show-error \
              --request HEAD \
              --header "Authorization: Bearer ${bearer}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              --dump-header - \
              --output /dev/null \
              --write-out $'\n%{http_code}' \
              "https://ghcr.io/v2/${repository_path}/manifests/${tag}")"
            headers="${response%$'\n'*}"
            status="${response##*$'\n'}"
            case "$status" in
              200)
                api_digest="$(awk '
                  tolower($1) == "docker-content-digest:" {
                    gsub("\\r", "", $2); digest=$2
                  }
                  END { print digest }
                ' <<<"$headers")"
                if [[ ! "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "::error::GHCR returned 200 without a complete Docker-Content-Digest for ${image}" >&2
                  return 1
                fi
                if ! inspect_output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
                  echo "::error::GHCR HEAD found ${image}, but OCI inspection failed" >&2
                  printf '%s\n' "$inspect_output" >&2
                  return 1
                fi
                inspect_digest="$(awk '$1 == "Digest:" { print $2; exit }' \
                  <<<"$inspect_output")"
                if [[ "$inspect_digest" != "$api_digest" ]]; then
                  echo "::error::GHCR HEAD and OCI inspection disagree for ${image}" >&2
                  echo "::error::head=${api_digest} inspect=${inspect_digest}" >&2
                  return 1
                fi
                printf '%s@%s\n' "${image%:*}" "$api_digest"
                ;;
              404)
                return 10
                ;;
              *)
                echo "::error::GHCR manifest check for ${image} returned HTTP ${status}; absence is not proven" >&2
                return 1
                ;;
            esac
          }

          select_candidate() {
            local canonical_tag=$1 staging_ref=$2 existing_ref state
            if existing_ref="$(registry_ref_if_exists "$canonical_tag")"; then
              printf '%s\tfalse\n' "$existing_ref"
              return 0
            fi
            state=$?
            if [[ "$state" -ne 10 ]]; then
              return "$state"
            fi
            if [[ "${staging_ref%@*}" != "${canonical_tag%:*}" || \
                  ! "${staging_ref#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::staging candidate is not an exact digest in the canonical repository" >&2
              return 1
            fi
            printf '%s\ttrue\n' "$staging_ref"
          }

          verify_release_labels() {
            local ref=$1 labels source_url
            source_url="https://github.com/${GITHUB_REPOSITORY}"
            docker pull "$ref" >/dev/null
            labels="$(docker image inspect --format '{{json .Config.Labels}}' "$ref")"
            jq -e \
              --arg source "$source_url" \
              --arg revision "$GITHUB_SHA" \
              --arg version "$RELEASE_VERSION" '
                .["org.opencontainers.image.source"] == $source and
                .["org.opencontainers.image.revision"] == $revision and
                .["org.opencontainers.image.version"] == $version
              ' <<<"$labels" >/dev/null || {
                echo "::error::selected image ${ref} has incorrect release labels"
                return 1
              }
          }

          IFS=$'\t' read -r backend_ref backend_needs_promotion \
            < <(select_candidate "$BACKEND_IMAGE" "$BACKEND_STAGING_REF")
          IFS=$'\t' read -r web_ref web_needs_promotion \
            < <(select_candidate "$WEB_IMAGE" "$WEB_STAGING_REF")
          verify_release_labels "$backend_ref"
          verify_release_labels "$web_ref"
          printf '%s\n' \
            "backend_ref=${backend_ref}" \
            "backend_needs_promotion=${backend_needs_promotion}" \
            "web_ref=${web_ref}" \
            "web_needs_promotion=${web_needs_promotion}" \
            >> "$GITHUB_OUTPUT"
      - name: Scan selected backend digest for all CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidates.outputs.backend_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan selected backend digest for fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidates.outputs.backend_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
      - name: Scan selected web digest for all CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidates.outputs.web_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan selected web digest for fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.candidates.outputs.web_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
      - name: Verify selected candidate provenance and signature
        env:
          BACKEND_REF: ${{ steps.candidates.outputs.backend_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_REF: ${{ steps.candidates.outputs.web_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for image_ref in "$BACKEND_REF" "$WEB_REF"; do
            verification="$(gh attestation verify "oci://${image_ref}" \
              --bundle-from-oci \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --format json)"
            image_name="${image_ref%@*}"
            digest_hex="${image_ref##*@sha256:}"
            jq -e --arg image_name "$image_name" --arg digest_hex "$digest_hex" '
              length > 0 and any(.[].verificationResult.statement;
                .predicateType == "https://slsa.dev/provenance/v1" and
                any(.subject[]; .name == $image_name and .digest.sha256 == $digest_hex)
              )
            ' <<<"$verification" >/dev/null || {
              echo "::error::selected provenance does not bind exact subject ${image_ref}"
              exit 1
            }
            cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image_ref" >/dev/null
          done
      - name: Generate backend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.candidates.outputs.backend_ref }}
          artifact-name: open-api-platform-backend-${{ steps.metadata.outputs.release_version }}.spdx.json
          output-file: release/open-api-platform-backend-${{ steps.metadata.outputs.release_version }}.spdx.json
          github-token: ""
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
      - name: Generate web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.candidates.outputs.web_ref }}
          artifact-name: open-api-platform-web-${{ steps.metadata.outputs.release_version }}.spdx.json
          output-file: release/open-api-platform-web-${{ steps.metadata.outputs.release_version }}.spdx.json
          github-token: ""
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
      - name: Normalize SBOM metadata to the release commit and digest
        env:
          BACKEND_REF: ${{ steps.candidates.outputs.backend_ref }}
          WEB_REF: ${{ steps.candidates.outputs.web_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_created="$(date -u -d "@$(git show -s --format=%ct "$GITHUB_SHA")" \
            +%Y-%m-%dT%H:%M:%SZ)"
          normalize_sbom() {
            local role=$1 image_ref=$2 path=$3 digest_hex namespace temporary
            digest_hex="${image_ref##*@sha256:}"
            [[ "$digest_hex" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::cannot normalize SBOM for incomplete digest ${image_ref}"
              return 1
            }
            namespace="https://github.com/${GITHUB_REPOSITORY}/sbom/${role}/${digest_hex}"
            temporary="${path}.normalized"
            jq -S \
              --arg created "$release_created" \
              --arg namespace "$namespace" '
                .creationInfo.created = $created |
                .documentNamespace = $namespace
              ' "$path" > "$temporary"
            mv "$temporary" "$path"
          }
          normalize_sbom backend "$BACKEND_REF" \
            "release/open-api-platform-backend-${RELEASE_VERSION}.spdx.json"
          normalize_sbom web "$WEB_REF" \
            "release/open-api-platform-web-${RELEASE_VERSION}.spdx.json"
      - name: Attest the exact normalized image SBOMs
        env:
          BACKEND_REF: ${{ steps.candidates.outputs.backend_ref }}
          WEB_REF: ${{ steps.candidates.outputs.web_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          attest_exact_sbom_if_missing() {
            local role=$1 image_ref=$2 sbom_path=$3 attestation_file image_name digest_hex
            image_name="${image_ref%@*}"
            digest_hex="${image_ref##*@sha256:}"
            attestation_file="$(mktemp)"
            if cosign verify-attestation --type spdxjson \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image_ref" >"$attestation_file" 2>/dev/null && \
              jq -e -n \
                --slurpfile attestations "$attestation_file" \
                --slurpfile sbom "$sbom_path" \
                --arg image_name "$image_name" \
                --arg digest_hex "$digest_hex" '
                  [$attestations[] |
                    if type == "array" then .[] else . end |
                    try ((.payload // .Payload) | @base64d | fromjson) catch empty] |
                  any(.[];
                    .predicate == $sbom[0] and
                    any(.subject[]?;
                      .name == $image_name and .digest.sha256 == $digest_hex
                    )
                  )
                ' >/dev/null; then
              rm -f -- "$attestation_file"
              echo "Reusing the exact ${role} SBOM attestation for ${image_ref}."
              return 0
            fi
            rm -f -- "$attestation_file"
            cosign attest --yes --type spdxjson \
              --predicate "$sbom_path" "$image_ref"
          }
          attest_exact_sbom_if_missing backend "$BACKEND_REF" \
            "release/open-api-platform-backend-${RELEASE_VERSION}.spdx.json"
          attest_exact_sbom_if_missing web "$WEB_REF" \
            "release/open-api-platform-web-${RELEASE_VERSION}.spdx.json"
      - name: Capture exact pre-promotion OCI evidence
        env:
          BACKEND_REF: ${{ steps.candidates.outputs.backend_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_REF: ${{ steps.candidates.outputs.web_ref }}
        shell: bash
        run: |
          bash scripts/capture-release-evidence.sh \
            release "$RELEASE_VERSION" "$BACKEND_REF" "$WEB_REF"
      - name: Promote or revalidate exact canonical image tags
        env:
          BACKEND_NEEDS_PROMOTION: ${{ steps.candidates.outputs.backend_needs_promotion }}
          BACKEND_REF: ${{ steps.candidates.outputs.backend_ref }}
          BACKEND_STAGING_IMAGE: ${{ steps.images.outputs.backend_staging_image }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verified-main-ci.outputs.release_tag_object_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_NEEDS_PROMOTION: ${{ steps.candidates.outputs.web_needs_promotion }}
          WEB_REF: ${{ steps.candidates.outputs.web_ref }}
          WEB_STAGING_IMAGE: ${{ steps.images.outputs.web_staging_image }}
        shell: bash
        run: |
          bash scripts/promote-release-images.sh \
            "$BACKEND_IMAGE" "$BACKEND_REF" "$BACKEND_STAGING_IMAGE" \
            "$BACKEND_NEEDS_PROMOTION" \
            "$WEB_IMAGE" "$WEB_REF" "$WEB_STAGING_IMAGE" \
            "$WEB_NEEDS_PROMOTION"
      - name: Re-capture post-promotion OCI evidence
        env:
          BACKEND_REF: ${{ steps.candidates.outputs.backend_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_REF: ${{ steps.candidates.outputs.web_ref }}
        shell: bash
        run: |
          bash scripts/capture-release-evidence.sh \
            release "$RELEASE_VERSION" "$BACKEND_REF" "$WEB_REF"
      - name: Require anonymous access to linked Community packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          owner_type="$(gh api "users/${GITHUB_REPOSITORY_OWNER}" --jq .type)"
          case "$owner_type" in
            User)
              package_api="users/${GITHUB_REPOSITORY_OWNER}/packages/container"
              ;;
            Organization)
              package_api="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container"
              ;;
            *)
              echo "::error::unsupported repository owner type: ${owner_type}"
              exit 1
              ;;
          esac

          for package_name in "$BACKEND_PACKAGE" "$WEB_PACKAGE"; do
            if ! package_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "${package_api}/${package_name}" 2>&1)"; then
              echo "::error::GHCR package ${package_name} is not publicly visible through the owner package endpoint"
              echo "::error::For a first release, change package visibility to Public, link it to ${GITHUB_REPOSITORY}, then rerun this failed job"
              printf '%s\n' "$package_json" >&2
              exit 1
            fi
            if ! jq -e --arg repository "$GITHUB_REPOSITORY" '
              .visibility == "public" and
              .repository.full_name == $repository
            ' <<<"$package_json" >/dev/null; then
              echo "::error::GHCR package ${package_name} must be linked to ${GITHUB_REPOSITORY} and Public before the Community release can be created"
              echo "::error::For a first release, change package visibility in GitHub Package settings, then rerun this failed job"
              exit 1
            fi
          done
      - name: Package source and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          git archive --format=tar.gz \
            --prefix="open-api-platform-${RELEASE_VERSION}/" \
            --output="release/open-api-platform-${RELEASE_VERSION}.tar.gz" HEAD
          printf '%s\n%s\n' "$BACKEND_REF" "$WEB_REF" > "release/image-digests-${RELEASE_VERSION}.txt"
          payload_assets=(
            "image-digests-${RELEASE_VERSION}.txt"
            "image-evidence-${RELEASE_VERSION}.json"
            "open-api-platform-${RELEASE_VERSION}.tar.gz"
            "open-api-platform-backend-${RELEASE_VERSION}.cosign-sbom-attestations.jsonl"
            "open-api-platform-backend-${RELEASE_VERSION}.cosign-signature-verification.json"
            "open-api-platform-backend-${RELEASE_VERSION}.cosign-signatures.jsonl"
            "open-api-platform-backend-${RELEASE_VERSION}.github-provenance.json"
            "open-api-platform-backend-${RELEASE_VERSION}.spdx.json"
            "open-api-platform-web-${RELEASE_VERSION}.cosign-sbom-attestations.jsonl"
            "open-api-platform-web-${RELEASE_VERSION}.cosign-signature-verification.json"
            "open-api-platform-web-${RELEASE_VERSION}.cosign-signatures.jsonl"
            "open-api-platform-web-${RELEASE_VERSION}.github-provenance.json"
            "open-api-platform-web-${RELEASE_VERSION}.spdx.json"
          )
          expected_names="$(printf '%s\n' "${payload_assets[@]}" | LC_ALL=C sort)"
          actual_names="$(find -P release -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | LC_ALL=C sort)"
          if [[ "$actual_names" != "$expected_names" ]] || \
             [[ "$(find -P release -mindepth 1 -maxdepth 1 -printf '%f\n' | wc -l)" -ne 13 ]]; then
            echo "::error::release payload contains a missing, extra, symbolic, or non-file entry before checksumming"
            exit 1
          fi
          (cd release && sha256sum -- "${payload_assets[@]}" > "SHA256SUMS-${RELEASE_VERSION}.txt")
        env:
          BACKEND_REF: ${{ steps.candidates.outputs.backend_ref }}
          WEB_REF: ${{ steps.candidates.outputs.web_ref }}
      - name: Sign the checksum manifest for offline verification
        shell: bash
        run: |
          set -Eeuo pipefail
          checksum="release/SHA256SUMS-${RELEASE_VERSION}.txt"
          bundle="release/SHA256SUMS-${RELEASE_VERSION}.sigstore.json"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign sign-blob --yes --bundle "$bundle" "$checksum"
          # Prove immediately that the bundle authenticates the exact manifest;
          # the final job repeats this check after the artifact hand-off.
          cosign verify-blob "$checksum" \
            --bundle "$bundle" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$GITHUB_SHA"
          release_assets=(
            "SHA256SUMS-${RELEASE_VERSION}.sigstore.json"
            "SHA256SUMS-${RELEASE_VERSION}.txt"
            "image-digests-${RELEASE_VERSION}.txt"
            "image-evidence-${RELEASE_VERSION}.json"
            "open-api-platform-${RELEASE_VERSION}.tar.gz"
            "open-api-platform-backend-${RELEASE_VERSION}.cosign-sbom-attestations.jsonl"
            "open-api-platform-backend-${RELEASE_VERSION}.cosign-signature-verification.json"
            "open-api-platform-backend-${RELEASE_VERSION}.cosign-signatures.jsonl"
            "open-api-platform-backend-${RELEASE_VERSION}.github-provenance.json"
            "open-api-platform-backend-${RELEASE_VERSION}.spdx.json"
            "open-api-platform-web-${RELEASE_VERSION}.cosign-sbom-attestations.jsonl"
            "open-api-platform-web-${RELEASE_VERSION}.cosign-signature-verification.json"
            "open-api-platform-web-${RELEASE_VERSION}.cosign-signatures.jsonl"
            "open-api-platform-web-${RELEASE_VERSION}.github-provenance.json"
            "open-api-platform-web-${RELEASE_VERSION}.spdx.json"
          )
          expected_names="$(printf '%s\n' "${release_assets[@]}" | LC_ALL=C sort)"
          actual_names="$(find -P release -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | LC_ALL=C sort)"
          if [[ "$actual_names" != "$expected_names" ]] || \
             [[ "$(find -P release -mindepth 1 -maxdepth 1 -printf '%f\n' | wc -l)" -ne 15 ]]; then
            echo "::error::signed release bundle is not the exact 15-asset whitelist"
            exit 1
          fi
      - name: Upload verifiable release bundle
        id: bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: open-api-platform-${{ steps.metadata.outputs.release_version }}
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish immutable GitHub Release
    runs-on: ubuntu-latest
    needs:
      - verified-main-ci
      - signed-images
    permissions:
      actions: read # Bind the hand-off to the exact current-run artifact.
      attestations: read # Verify GitHub provenance copied from OCI.
      contents: write # Create, upload, and publish the immutable Release.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download the exact verified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.signed-images.outputs.artifact_id }}
          merge-multiple: true
          path: release
      - name: Bind the downloaded artifact to this workflow attempt
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.signed-images.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.signed-images.outputs.artifact_id }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.signed-images.outputs.artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}")"
          expected_digest="${EXPECTED_ARTIFACT_DIGEST#sha256:}"
          jq -e \
            --arg expected_digest "sha256:${expected_digest}" \
            --arg expected_id "$EXPECTED_ARTIFACT_ID" \
            --arg expected_name "$EXPECTED_ARTIFACT_NAME" \
            --argjson expected_run "$GITHUB_RUN_ID" '
              (.id | tostring) == $expected_id and
              .name == $expected_name and
              .expired == false and
              .digest == $expected_digest and
              .workflow_run.id == $expected_run
            ' <<<"$artifact_json" >/dev/null || {
              echo "::error::downloaded release bundle is not the exact current-run artifact"
              jq -c '{id, name, expired, digest, workflow_run}' <<<"$artifact_json"
              exit 1
            }
      - name: Install checksum-pinned Cosign without a third-party action
        shell: bash
        run: |
          set -Eeuo pipefail
          cosign_path="${RUNNER_TEMP}/cosign-linux-amd64"
          curl --fail --silent --show-error --location \
            https://github.com/sigstore/cosign/releases/download/v3.0.6/cosign-linux-amd64 \
            --output "$cosign_path"
          printf '%s  %s\n' \
            c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74 \
            "$cosign_path" | sha256sum --check --strict
          sudo install -m 0755 "$cosign_path" /usr/local/bin/cosign
      - name: Publish a resumable verified GitHub Release
        env:
          BACKEND_IMAGE: ${{ needs.signed-images.outputs.backend_image }}
          BACKEND_REF: ${{ needs.signed-images.outputs.backend_ref }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verified-main-ci.outputs.release_tag_object_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.signed-images.outputs.release_version }}
          WEB_IMAGE: ${{ needs.signed-images.outputs.web_image }}
          WEB_REF: ${{ needs.signed-images.outputs.web_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          verify_release_tag_identity() {
            local encoded_tag ref_json tag_json
            bash scripts/verify-release-tag.sh || return 1
            if [[ ! "$EXPECTED_TAG_OBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::verified-main-ci did not provide a complete annotated tag object SHA"
              return 1
            fi
            encoded_tag="$(jq -rn --arg tag "$GITHUB_REF_NAME" '$tag | @uri')"
            if ! ref_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}")"; then
              echo "::error::cannot re-read the release tag ref"
              return 1
            fi
            if ! jq -e \
              --arg expected_ref "refs/tags/${GITHUB_REF_NAME}" \
              --arg expected_tag_sha "$EXPECTED_TAG_OBJECT_SHA" '
                .ref == $expected_ref and
                .object.type == "tag" and
                .object.sha == $expected_tag_sha
              ' <<<"$ref_json" >/dev/null; then
              echo "::error::release tag ref moved after the initial identity gate"
              return 1
            fi
            if ! tag_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/git/tags/${EXPECTED_TAG_OBJECT_SHA}")"; then
              echo "::error::cannot re-read the signed annotated release tag"
              return 1
            fi
            if ! jq -e \
              --arg expected_tag "$GITHUB_REF_NAME" \
              --arg expected_tag_sha "$EXPECTED_TAG_OBJECT_SHA" \
              --arg expected_commit "$GITHUB_SHA" '
                .sha == $expected_tag_sha and
                .tag == $expected_tag and
                .object.type == "commit" and
                .object.sha == $expected_commit and
                .verification.verified == true and
                .verification.reason == "valid" and
                .tagger.name == "徐鸿铎" and
                .tagger.email == "x.hongduo@hotmail.com"
              ' <<<"$tag_json" >/dev/null; then
              echo "::error::release tag identity/signature no longer matches the initial gate"
              return 1
            fi
          }

          verify_canonical_image_tags() {
            local canonical_tag expected_ref output digest resolved_ref
            while IFS=$'\t' read -r canonical_tag expected_ref; do
              if ! output="$(docker buildx imagetools inspect "$canonical_tag" 2>&1)"; then
                echo "::error::canonical image tag is no longer resolvable: ${canonical_tag}" >&2
                printf '%s\n' "$output" >&2
                return 1
              fi
              digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$output")"
              resolved_ref="${canonical_tag%:*}@${digest}"
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ || \
                    "$resolved_ref" != "$expected_ref" ]]; then
                echo "::error::canonical image tag moved after verified promotion: ${canonical_tag}" >&2
                echo "::error::expected=${expected_ref} registry=${resolved_ref}" >&2
                return 1
              fi
            done < <(printf '%s\t%s\n%s\t%s\n' \
              "$BACKEND_IMAGE" "$BACKEND_REF" "$WEB_IMAGE" "$WEB_REF")
          }

          verify_live_oci_evidence() {
            local evidence_root=$1
            bash scripts/verify-live-release-evidence.sh \
              "$evidence_root" "$RELEASE_VERSION" "$BACKEND_REF" "$WEB_REF"
          }

          checksum_name="SHA256SUMS-${RELEASE_VERSION}.txt"
          checksum_bundle="SHA256SUMS-${RELEASE_VERSION}.sigstore.json"
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          expected_asset_name_list=(
            "SHA256SUMS-${RELEASE_VERSION}.sigstore.json"
            "SHA256SUMS-${RELEASE_VERSION}.txt"
            "image-digests-${RELEASE_VERSION}.txt"
            "image-evidence-${RELEASE_VERSION}.json"
            "open-api-platform-${RELEASE_VERSION}.tar.gz"
            "open-api-platform-backend-${RELEASE_VERSION}.cosign-sbom-attestations.jsonl"
            "open-api-platform-backend-${RELEASE_VERSION}.cosign-signature-verification.json"
            "open-api-platform-backend-${RELEASE_VERSION}.cosign-signatures.jsonl"
            "open-api-platform-backend-${RELEASE_VERSION}.github-provenance.json"
            "open-api-platform-backend-${RELEASE_VERSION}.spdx.json"
            "open-api-platform-web-${RELEASE_VERSION}.cosign-sbom-attestations.jsonl"
            "open-api-platform-web-${RELEASE_VERSION}.cosign-signature-verification.json"
            "open-api-platform-web-${RELEASE_VERSION}.cosign-signatures.jsonl"
            "open-api-platform-web-${RELEASE_VERSION}.github-provenance.json"
            "open-api-platform-web-${RELEASE_VERSION}.spdx.json"
          )
          expected_asset_names="$(printf '%s\n' "${expected_asset_name_list[@]}" | \
            LC_ALL=C sort | jq -Rsc 'split("\n") | map(select(length > 0))')"
          assets=()
          for name in "${expected_asset_name_list[@]}"; do
            assets+=("release/${name}")
          done

          verify_release_bundle() {
            local root=$1 expected_checksum_names declared_checksum_names
            local declared_digest declared_name extra actual_names
            if [[ ! -f "${root}/${checksum_name}" || \
                  ! -f "${root}/${checksum_bundle}" || \
                  -L "${root}/${checksum_name}" || \
                  -L "${root}/${checksum_bundle}" ]]; then
              echo "::error::release candidate lacks the regular signed checksum manifest"
              return 1
            fi

            # The signed manifest is the trust root. Verify its fixed workflow
            # identity before accepting any checksum or structural evidence.
            cosign verify-blob "${root}/${checksum_name}" \
              --bundle "${root}/${checksum_bundle}" \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-sha "$GITHUB_SHA" || return 1

            if ! actual_names="$(find -P "$root" -mindepth 1 -maxdepth 1 -type f \
              -printf '%f\n' | LC_ALL=C sort | jq -Rsc 'split("\n") | map(select(length > 0))')"; then
              echo "::error::cannot enumerate release candidate files"
              return 1
            fi
            if [[ "$actual_names" != "$expected_asset_names" ]]; then
              echo "::error::release candidate does not contain the exact asset whitelist"
              return 1
            fi
            if [[ "$(find -P "$root" -mindepth 1 -maxdepth 1 -printf '%f\n' | wc -l)" -ne \
                  "$(jq 'length' <<<"$expected_asset_names")" ]]; then
              echo "::error::release candidate contains a directory, symlink, or other non-file entry"
              return 1
            fi

            while read -r declared_digest declared_name extra; do
              if [[ -n "${extra:-}" || \
                    ! "$declared_digest" =~ ^[0-9a-f]{64}$ || \
                    ! "$declared_name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ || \
                    "$declared_name" != "${declared_name##*/}" || \
                    "$declared_name" == "$checksum_name" || \
                    "$declared_name" == "$checksum_bundle" ]]; then
                echo "::error::unsafe or malformed checksum entry: ${declared_name:-missing}"
                return 1
              fi
            done < "${root}/${checksum_name}"
            expected_checksum_names="$(find -P "$root" -mindepth 1 -maxdepth 1 -type f \
              ! -name "$checksum_name" \
              ! -name "$checksum_bundle" \
              -printf '%f\n' | LC_ALL=C sort)"
            declared_checksum_names="$(awk '{print $2}' "${root}/${checksum_name}" | LC_ALL=C sort)"
            if [[ "$expected_checksum_names" != "$declared_checksum_names" ]]; then
              echo "::error::SHA256SUMS must cover every non-signature release asset exactly once"
              return 1
            fi
            (cd "$root" && sha256sum --check --strict "$checksum_name") || return 1

            python3 scripts/verify-release-evidence.py \
              "$root" "${root}/image-evidence-${RELEASE_VERSION}.json" \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --version "$RELEASE_VERSION" \
              --backend-ref "$BACKEND_REF" \
              --web-ref "$WEB_REF" || return 1
            if ! cmp -s \
              <(printf '%s\n%s\n' "$BACKEND_REF" "$WEB_REF") \
              "${root}/image-digests-${RELEASE_VERSION}.txt"; then
              echo "::error::release image-digests asset does not contain the exact selected refs"
              return 1
            fi
            if ! gzip -t "${root}/open-api-platform-${RELEASE_VERSION}.tar.gz"; then
              echo "::error::release source archive is not a valid gzip stream"
              return 1
            fi
            if ! gzip -dc -- "${root}/open-api-platform-${RELEASE_VERSION}.tar.gz" | \
              cmp - <(git archive --format=tar \
                --prefix="open-api-platform-${RELEASE_VERSION}/" HEAD); then
              echo "::error::release source archive does not byte-match the clean checkout"
              return 1
            fi
          }

          release_title="Open API Platform ${RELEASE_VERSION}"
          release_body="Verified automated Community release ${GITHUB_REF_NAME} for source commit ${GITHUB_SHA}."
          release_author="github-actions[bot]"

          validate_release_metadata() {
            local release_json=$1
            jq -e \
              --arg author "$release_author" \
              --arg body "$release_body" \
              --arg tag "$GITHUB_REF_NAME" \
              --arg title "$release_title" '
                .tagName == $tag and
                .name == $title and
                .body == $body and
                .author.login == $author and
                (.isDraft | type) == "boolean" and
                (.isImmutable | type) == "boolean"
              ' <<<"$release_json" >/dev/null || {
                echo "::error::existing Release author, title, body, tag, or state does not match the deterministic release metadata"
                return 1
              }
          }

          release_asset_names_match() {
            local release_json=$1
            jq -e --argjson expected "$expected_asset_names" '
              (.assets | length) == ($expected | length) and
              all(.assets[];
                .state == "uploaded" and
                (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._+-]*$")) and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                (.size | type == "number" and . >= 0)
              ) and
              ([.assets[].name] | sort) == $expected
            ' <<<"$release_json" >/dev/null
          }

          candidate_directories=()
          cleanup_candidates() {
            if (( ${#candidate_directories[@]} > 0 )); then
              rm -rf -- "${candidate_directories[@]}"
            fi
          }
          trap cleanup_candidates EXIT

          verify_existing_release_assets() {
            local release_json=$1 candidate_dir downloaded_names
            local asset_name asset_digest asset_size actual_digest actual_size
            local -a download_arguments
            if ! release_asset_names_match "$release_json"; then
              echo "::error::non-empty Release does not contain the exact safe asset whitelist"
              return 1
            fi
            [[ -d "${RUNNER_TEMP:-}" ]] || {
              echo "::error::RUNNER_TEMP is unavailable for isolated Release verification"
              return 1
            }
            if ! candidate_dir="$(mktemp -d "${RUNNER_TEMP%/}/release-candidate.XXXXXX")"; then
              echo "::error::cannot create isolated Release verification directory"
              return 1
            fi
            candidate_directories+=("$candidate_dir")
            chmod 0700 "$candidate_dir" || return 1

            # Asset names were whitelisted above. Download every existing asset
            # into a fresh directory; never overlay the current-run bundle.
            download_arguments=()
            for asset_name in "${expected_asset_name_list[@]}"; do
              download_arguments+=(--pattern "$asset_name")
            done
            gh release download "$GITHUB_REF_NAME" \
              --dir "$candidate_dir" "${download_arguments[@]}" || return 1
            if ! downloaded_names="$(find -P "$candidate_dir" -mindepth 1 -maxdepth 1 -type f \
              -printf '%f\n' | LC_ALL=C sort | jq -Rsc 'split("\n") | map(select(length > 0))')"; then
              echo "::error::cannot enumerate downloaded Release assets"
              return 1
            fi
            if [[ "$downloaded_names" != "$expected_asset_names" ]] || \
               [[ "$(find -P "$candidate_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | wc -l)" -ne \
                  "$(jq 'length' <<<"$expected_asset_names")" ]]; then
              echo "::error::downloaded Release contains missing, extra, nested, symbolic, or non-file entries"
              return 1
            fi

            verify_release_bundle "$candidate_dir" || return 1
            while IFS=$'\t' read -r asset_name asset_digest asset_size; do
              if ! actual_digest="sha256:$(sha256sum "${candidate_dir}/${asset_name}" | awk '{print $1}')" || \
                 ! actual_size="$(stat -c '%s' "${candidate_dir}/${asset_name}")"; then
                echo "::error::cannot hash downloaded asset: ${asset_name}"
                return 1
              fi
              if [[ "$actual_digest" != "$asset_digest" || "$actual_size" != "$asset_size" ]]; then
                echo "::error::authenticated asset does not match GitHub metadata: ${asset_name}"
                return 1
              fi
            done < <(jq -r '.assets[] | [.name, .digest, (.size | tostring)] | @tsv' <<<"$release_json")
            verify_release_tag_identity || return 1
            verify_canonical_image_tags || return 1
            verify_live_oci_evidence "$candidate_dir" || return 1
          }

          verify_release_bundle release
          verify_release_tag_identity
          verify_canonical_image_tags
          verify_live_oci_evidence release

          if release_json="$(gh release view "$GITHUB_REF_NAME" \
            --json assets,author,body,isDraft,isImmutable,name,tagName 2>/dev/null)"; then
            validate_release_metadata "$release_json"
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" == "false" ]]; then
              if [[ "$(jq -r '.isImmutable' <<<"$release_json")" != "true" ]]; then
                echo "::error::published release ${GITHUB_REF_NAME} is not immutable"
                echo "::error::Delete this non-immutable release, have a repository administrator enable immutable releases, then rerun the release workflow."
                exit 1
              fi
              verify_existing_release_assets "$release_json"
              verify_release_tag_identity
              verify_canonical_image_tags
              echo "Release ${GITHUB_REF_NAME} is already immutable; its downloaded assets and live OCI evidence remain valid."
              exit 0
            fi
            asset_count="$(jq '.assets | length' <<<"$release_json")"
            if [[ "$asset_count" -gt 0 ]]; then
              if ! verify_existing_release_assets "$release_json"; then
                echo "::error::non-empty draft is incomplete or invalid; delete it manually and rerun to rebuild it"
                exit 1
              fi
              echo "Reusing the existing fully verified draft without changing its assets."
            else
              echo "Resuming an empty verified draft; current-run assets may be uploaded once."
            fi
          else
            verify_release_tag_identity
            verify_canonical_image_tags
            verify_live_oci_evidence release
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "$release_title" \
              --notes "$release_body"
            verify_release_tag_identity
            verify_canonical_image_tags
            verify_live_oci_evidence release
            release_json="$(gh release view "$GITHUB_REF_NAME" \
              --json assets,author,body,isDraft,isImmutable,name,tagName)"
            validate_release_metadata "$release_json"
            if [[ "$(jq '.assets | length' <<<"$release_json")" -ne 0 ]]; then
              echo "::error::new draft unexpectedly contains assets; delete it manually and rerun"
              exit 1
            fi
            asset_count=0
          fi

          if [[ "$asset_count" -eq 0 ]]; then
            # No overwrite option is permitted. A concurrent or pre-seeded
            # asset makes the upload/follow-up whitelist verification fail.
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
          fi
          release_json="$(gh release view "$GITHUB_REF_NAME" \
            --json assets,author,body,isDraft,isImmutable,name,tagName)"
          validate_release_metadata "$release_json"
          if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]] || \
             ! verify_existing_release_assets "$release_json"; then
            echo "::error::draft is not the complete authenticated candidate; delete it manually and rerun"
            exit 1
          fi

          verify_release_tag_identity
          verify_canonical_image_tags
          gh release edit "$GITHUB_REF_NAME" --verify-tag --draft=false
          verify_release_tag_identity
          verify_canonical_image_tags
          for _ in 1 2 3 4 5; do
            release_json="$(gh release view "$GITHUB_REF_NAME" \
              --json assets,author,body,isDraft,isImmutable,name,tagName)"
            if validate_release_metadata "$release_json" && \
               [[ "$(jq -r '.isDraft' <<<"$release_json")" == "false" ]] && \
               [[ "$(jq -r '.isImmutable' <<<"$release_json")" == "true" ]]; then
              verify_existing_release_assets "$release_json"
              verify_release_tag_identity
              verify_canonical_image_tags
              echo "Published immutable release ${GITHUB_REF_NAME} after re-downloading and authenticating every asset."
              exit 0
            fi
            sleep 2
          done
          echo "::error::published release failed final asset or immutability verification"
          echo "::error::If isImmutable is false, delete this release, have an administrator enable immutable releases, and rerun the workflow."
          exit 1
