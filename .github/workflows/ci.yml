name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install release hygiene dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep
      - name: 开源发布卫生检查
        run: bash scripts/check-public-release.sh
      - name: Version markers stay synchronized
        run: python scripts/check-version-sync.py
      - name: Validate Docker Compose manifests
        env:
          POSTGRES_PASSWORD: compose-validation-postgres-password
          REDIS_PASSWORD: compose-validation-redis-password
          REDIS_SENTINEL_PASSWORD: compose-validation-sentinel-password
          JWT_SECRET: compose-validation-jwt-secret-at-least-32-characters
          DATA_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
          ADMIN_BOOTSTRAP_TOKEN: compose-validation-bootstrap-token-2026-08-31-at-least-32-bytes
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.app.yml config -q
          docker compose -f docker-compose.app.yml -f docker-compose.sentinel.yml config -q
      - name: Redis Sentinel promotion and AOF persistence drill
        run: bash scripts/test-sentinel-failover.sh
      - name: Git history secret scan
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --config=/repo/.gitleaks.toml
          --redact --verbose --exit-code=1 --log-opts=--all

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python dependency audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --disable-pip --no-deps -r backend/requirements.lock
          python -m pip_audit -r backend/requirements-dev.txt
      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # 绝大多数用例是纯逻辑单测；论坛等少数集成用例要查真库，由这里的 service
    # 提供（不可达时 conftest 的 requires_db 会 skip，不会伪装成失败）。
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_ci_postgres
          POSTGRES_DB: openapi_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d openapi_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 语法检查
        working-directory: backend
        run: find app -name "*.py" -print0 | xargs -0 python -m py_compile
      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check app tests ../scripts
      - name: Security lint (Bandit)
        working-directory: backend
        run: python -m bandit -r app -ll -ii -q
      - name: Public OpenAPI export is current
        run: python scripts/export-openapi.py --check
      - name: 空库迁移到 head
        working-directory: backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg://platform:platform_ci_postgres@127.0.0.1:5432/openapi_platform
          REDIS_URL: redis://localhost:6399/0
          REDIS_REQUIRED_ON_STARTUP: "false"
          JWT_SECRET: platform-ci-jwt-secret-only-for-tests
          DATA_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic check
      - name: 单元测试 + 集成用例（fakeredis 免外部 Redis，PG 由 service 提供）
        working-directory: backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg://platform:platform_ci_postgres@127.0.0.1:5432/openapi_platform
          REDIS_URL: redis://localhost:6399/0
          REDIS_REQUIRED_ON_STARTUP: "false"
          JWT_SECRET: platform-ci-jwt-secret-only-for-tests
          DATA_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 三语字典键一致性
        working-directory: frontend
        run: npm run check:i18n
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 单元测试
        working-directory: frontend
        run: npm test
      - name: 构建
        working-directory: frontend
        run: npm run build
      - name: 离线自检（禁止公网域名 / oklch / color-mix）
        working-directory: frontend
        run: |
          if grep -rIE "https?://(fonts\.|cdn\.|unpkg\.|jsdelivr\.|googleapis|gstatic|sentry|datadog)" dist; then
            echo "::error::dist 含公网域名引用，违反离线约束"; exit 1
          fi
          # JavaScript libraries may contain these tokens in CSS parsers without
          # emitting either feature. Inspect only rendered style/markup assets.
          if grep -rIl --include='*.css' --include='*.html' "oklch\|color-mix" dist; then
            echo "::error::dist 含 oklch/color-mix，旧浏览器不兼容"; exit 1
          fi
          echo "✓ 离线自检通过"

  e2e:
    name: Full-stack browser E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: apiplatform-e2e
      BACKEND_IMAGE: apiplatform-backend:e2e
      NGINX_IMAGE: apiplatform-nginx:e2e
      POSTGRES_PASSWORD: e2e-postgres-password-release-check
      REDIS_PASSWORD: e2e-redis-password-release-check
      JWT_SECRET: e2e-jwt-secret-release-check-at-least-32-characters
      DATA_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
      ADMIN_BOOTSTRAP_TOKEN: e2e-bootstrap-token-release-check-2026-08-31-at-least-32-bytes
      SESSION_COOKIE_SECURE: "false"
      DEMO_DATA_ENABLED: "false"
      HTTP_PORT: "18080"
      POSTGRES_PORT: "65432"
      REDIS_PORT: "6399"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build application images
        run: |
          docker build -t "$BACKEND_IMAGE" backend
          docker build -t "$NGINX_IMAGE" -f nginx/Dockerfile .
      - name: Start isolated full stack
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml
          up -d postgres redis mock-upstream backend nginx
      - name: Wait for gateway readiness
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs
          exit 1
      - name: Run release-critical browser flows
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
        run: npm run test:e2e
      - name: Capture E2E service logs
        if: always()
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml
          logs --no-color > e2e-compose.log 2>&1
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            e2e-compose.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop isolated full stack
        if: always()
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml
          down --volumes --remove-orphans

  container-security:
    name: Container security
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, dependency-security]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Capture unfiltered PostgreSQL HIGH and CRITICAL report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: json
          output: postgres-unfiltered-high-critical.json
          exit-code: "0"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
      - name: Capture unfiltered Grafana HIGH and CRITICAL report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: json
          output: grafana-unfiltered-high-critical.json
          exit-code: "0"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
      - name: Capture Trivy scanner and database metadata
        run: trivy version --cache-dir "${{runner.temp}}/trivy-cache" --format json > trivy-version.json
      - name: Upload unfiltered third-party vulnerability evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: third-party-container-vulnerability-evidence
          path: |
            postgres-unfiltered-high-critical.json
            grafana-unfiltered-high-critical.json
            trivy-version.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate time-bounded container exceptions
        run: python3 scripts/check-container-security-exceptions.py --evidence-dir .
      - name: Build backend image
        run: docker build -t apiplatform-backend:ci backend
      - name: Verify backend runtime boundary
        run: |
          docker run --rm --entrypoint /bin/sh apiplatform-backend:ci -c '
            test "$(id -u)" = 10001
            test "$(id -g)" = 10001
            pg_dump --version | grep -Eq "^pg_dump \(PostgreSQL\) 16\."
            pg_restore --version | grep -Eq "^pg_restore \(PostgreSQL\) 16\."
            python -c "import app.main, cryptography, psycopg, uvloop"
            ! command -v pip
            ! command -v perl
          '
      - name: Build web image
        run: docker build -t apiplatform-nginx:ci -f nginx/Dockerfile .
      - name: Verify web runtime boundary
        run: |
          docker run --rm --entrypoint /bin/sh apiplatform-nginx:ci -c '
            test "$(id -u)" = 101
            test "$(id -g)" = 101
            ! command -v node
            ! command -v npm
          '
          # nginx resolves static upstream names while loading the config. The
          # CI smoke test runs outside Compose, so provide a non-routable test
          # mapping instead of weakening the production upstream definition.
          docker run --rm --add-host backend:127.0.0.1 apiplatform-nginx:ci nginx -t
      - name: Scan backend image for all CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apiplatform-backend:ci
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan backend image for fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apiplatform-backend:ci
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
      - name: Scan web image for all CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apiplatform-nginx:ci
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan web image for fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apiplatform-nginx:ci
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
      - name: Scan PostgreSQL runtime for all CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
          trivyignores: security/trivy/postgres-16-alpine-critical.yaml
      - name: Scan PostgreSQL runtime for fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
          trivyignores: security/trivy/postgres-16-alpine-high.yaml
      - name: Scan Redis runtime for all CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan Redis runtime for fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
      - name: Scan Prometheus runtime for all CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan Prometheus runtime for fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
      - name: Scan Grafana runtime for all CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: Scan Grafana runtime for fixable HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
          cache-dir: ${{runner.temp}}/trivy-cache
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH
          trivyignores: security/trivy/grafana-13.2.0-high.yaml
      - name: Generate backend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: apiplatform-backend:ci
          artifact-name: apiplatform-backend-sbom.spdx.json
      - name: Generate web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: apiplatform-nginx:ci
          artifact-name: apiplatform-nginx-sbom.spdx.json
